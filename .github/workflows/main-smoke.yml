name: Main smoke and build caches

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/downloads
  VCPKG_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.cache/vcpkg/archives,readwrite"
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_MAXSIZE: 1G

jobs:
  warm:
    name: ${{ matrix.name }} cache warmup
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug
            preset: ci-linux-gcc-debug
            cc: /usr/bin/gcc
            cxx: /usr/bin/g++
            vcpkg_cache: gcc
            writes_vcpkg_downloads: true
            writes_vcpkg_binaries: true
          - name: GCC Release
            preset: ci-linux-gcc-release
            cc: /usr/bin/gcc
            cxx: /usr/bin/g++
            vcpkg_cache: gcc
            writes_vcpkg_downloads: false
            writes_vcpkg_binaries: false
          - name: Clang Debug
            preset: ci-linux-clang-debug
            cc: /usr/bin/clang
            cxx: /usr/bin/clang++
            vcpkg_cache: clang
            writes_vcpkg_downloads: false
            writes_vcpkg_binaries: true
          - name: Clang Release
            preset: ci-linux-clang-release
            cc: /usr/bin/clang
            cxx: /usr/bin/clang++
            vcpkg_cache: clang
            writes_vcpkg_downloads: false
            writes_vcpkg_binaries: false
          - name: GCC ASan + UBSan
            preset: ci-linux-gcc-asan-ubsan
            cc: /usr/bin/gcc
            cxx: /usr/bin/g++
            vcpkg_cache: gcc
            writes_vcpkg_downloads: false
            writes_vcpkg_binaries: false

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Linux dependencies
        id: setup
        uses: ./.github/actions/setup-linux
        with:
          compiler: ${{ matrix.vcpkg_cache }}
          writes-downloads: ${{ matrix.writes_vcpkg_downloads }}

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/ccache
          key: ccache-v6-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ steps.setup.outputs.compiler-identity }}-${{ steps.setup.outputs.month }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v6-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ steps.setup.outputs.compiler-identity }}-${{ steps.setup.outputs.month }}-
            ccache-v6-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ steps.setup.outputs.compiler-identity }}-

      - name: Configure build
        run: cmake --preset "${{ matrix.preset }}"

      - name: Save vcpkg downloads cache
        if: matrix.writes_vcpkg_downloads && steps.setup.outputs.downloads-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/vcpkg/downloads
          key: ${{ steps.setup.outputs.downloads-cache-key }}

      - name: Save vcpkg binary cache
        if: matrix.writes_vcpkg_binaries && steps.setup.outputs.binary-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/vcpkg/archives
          key: ${{ steps.setup.outputs.binary-cache-key }}

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      # Match the PR build targets, including unit-test objects, for each preset.
      - name: Build all libraries and tests
        run: cmake --build --preset "${{ matrix.preset }}"

      - name: Run build-tree and installed-package smoke tests
        if: matrix.preset == 'ci-linux-gcc-debug'
        run: >-
          ctest --preset ci-linux-gcc-debug --output-on-failure --no-tests=error
          -R '^ptxsim_arith_(build-tree|installed)_consumer$'

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats || true
