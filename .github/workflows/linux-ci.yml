name: Linux CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: read

env:
  VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/downloads
  VCPKG_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.cache/vcpkg/archives,readwrite"
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_MAXSIZE: 1G

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    concurrency:
      group: linux-ci-${{ github.ref }}-${{ matrix.preset }}-${{ matrix.mode }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug
            preset: ci-linux-gcc-debug
            mode: core
          - name: GCC Debug + Lowering
            preset: ci-linux-gcc-debug
            mode: lowering
          - name: GCC Release
            preset: ci-linux-gcc-release
            mode: core
          - name: GCC Release + Lowering
            preset: ci-linux-gcc-release
            mode: lowering
          - name: Clang Debug
            preset: ci-linux-clang-debug
            mode: core
          - name: Clang Debug + Lowering
            preset: ci-linux-clang-debug
            mode: lowering
          - name: Clang Release
            preset: ci-linux-clang-release
            mode: core
          - name: Clang Release + Lowering
            preset: ci-linux-clang-release
            mode: lowering
          - name: GCC ASan + UBSan
            preset: ci-linux-gcc-asan-ubsan
            mode: core
          - name: GCC ASan + UBSan + Lowering
            preset: ci-linux-gcc-asan-ubsan
            mode: lowering

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reject floating third-party action references
        shell: bash
        run: |
          refs="$({
            while IFS= read -r workflow; do
              sed -nE 's/^[[:space:]]*uses:[[:space:]]*([^[:space:]#]+).*/\1/p' "$workflow"
            done < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \))
          } | grep -Ev '^(\./|docker://)' || true)"
          invalid="$(printf '%s\n' "$refs" | grep -Ev '@[0-9a-f]{40}$' || true)"
          if [[ -n "$invalid" ]]; then
            printf 'Floating third-party action reference(s):\n%s\n' "$invalid" >&2
            exit 1
          fi

      - name: Compute cache epoch
        id: cache-epoch
        shell: bash
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore APT package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/apt/archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-epoch.outputs.month }}-${{ hashFiles('.github/workflows/linux-ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-epoch.outputs.month }}-

      - name: Install system dependencies
        shell: bash
        env:
          APT_CACHE_DIR: ${{ github.workspace }}/.cache/apt/archives
        run: |
          mkdir -p "$APT_CACHE_DIR/partial"
          chmod 0777 "$APT_CACHE_DIR" "$APT_CACHE_DIR/partial"
          sudo apt-get update
          sudo apt-get \
            -o Dir::Cache::archives="$APT_CACHE_DIR" \
            -o Binary::apt::APT::Keep-Downloaded-Packages=true \
            install -y --no-install-recommends \
            build-essential \
            ccache \
            clang \
            clang-format \
            cmake \
            curl \
            flex \
            gcc \
            g++ \
            git \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-venv \
            tar \
            unzip \
            zip
          sudo chmod -R a+rX "$APT_CACHE_DIR"

      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/vcpkg/archives
            .cache/vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare vcpkg cache directories
        shell: bash
        run: mkdir -p "$VCPKG_BINARY_CACHE" "$VCPKG_DOWNLOADS"

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgJsonGlob: '**/vcpkg.json'
          runVcpkgInstall: false
          doNotCache: true

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/ccache
          key: ccache-v3-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ matrix.mode }}-${{ steps.cache-epoch.outputs.month }}-${{ hashFiles('.github/workflows/linux-ci.yml', 'CMakeLists.txt', 'CMakePresets.json', '**/CMakeLists.txt', '**/*.cmake', 'vcpkg.json') }}
          restore-keys: |
            ccache-v3-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ matrix.mode }}-

      - name: Run core CMake workflow preset
        if: matrix.mode == 'core'
        shell: bash
        run: cmake --workflow --preset "${{ matrix.preset }}"

      - name: Run full frontend-lowering build and tests
        if: matrix.mode == 'lowering'
        shell: bash
        run: |
          cmake --preset "${{ matrix.preset }}" \
            "-DVCPKG_MANIFEST_FEATURES=tests;frontend-lowering"
          cmake --build "out/build/${{ matrix.preset }}"

          test_list="$(ctest --test-dir "out/build/${{ matrix.preset }}" -N)"
          printf '%s\n' "$test_list"
          for pattern in \
            'ModuleLowering\.' \
            'LoweringContext\.' \
            'LoweringDiagnostic\.' \
            'ptxsim_lowering_build-tree_consumer' \
            'ptxsim_lowering_installed_consumer'; do
            if ! grep -Eq "$pattern" <<<"$test_list"; then
              printf 'Missing required lowering test: %s\n' "$pattern" >&2
              exit 1
            fi
          done

          ctest --test-dir "out/build/${{ matrix.preset }}" --output-on-failure

      - name: Show compiler cache statistics
        if: always()
        shell: bash
        run: ccache --show-stats || true
