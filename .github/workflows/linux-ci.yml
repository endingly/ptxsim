name: Linux CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: read

env:
  VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/downloads
  VCPKG_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.cache/vcpkg/archives,readwrite"
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_MAXSIZE: 1G

jobs:
  python:
    name: Python generators
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: linux-ci-${{ github.ref }}-python
      cancel-in-progress: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Python dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-pip python3-venv

      - name: Set up Python environment
        shell: bash
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -e .

      - name: Test Python generators
        shell: bash
        run: |
          .venv/bin/python -m unittest discover -s python/tests -v
          .venv/bin/python -m unittest discover -s submod/exec_ir/python/tests -v
          .venv/bin/python -m unittest discover -s submod/exec_ir_lowering/python/tests -v
          .venv/bin/python -m unittest discover -s submod/inst_execute_engine/python/tests -v

  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    concurrency:
      group: linux-ci-${{ github.ref }}-${{ matrix.preset }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug
            preset: ci-linux-gcc-debug
            cc: /usr/bin/gcc
            cxx: /usr/bin/g++
            vcpkg_cache: gcc
            writes_vcpkg_downloads: true
          - name: GCC Release
            preset: ci-linux-gcc-release
            cc: /usr/bin/gcc
            cxx: /usr/bin/g++
            vcpkg_cache: gcc
            writes_vcpkg_downloads: false
          - name: Clang Debug
            preset: ci-linux-clang-debug
            cc: /usr/bin/clang
            cxx: /usr/bin/clang++
            vcpkg_cache: clang
            writes_vcpkg_downloads: false
          - name: Clang Release
            preset: ci-linux-clang-release
            cc: /usr/bin/clang
            cxx: /usr/bin/clang++
            vcpkg_cache: clang
            writes_vcpkg_downloads: false
          - name: GCC ASan + UBSan
            preset: ci-linux-gcc-asan-ubsan
            cc: /usr/bin/gcc
            cxx: /usr/bin/g++
            vcpkg_cache: gcc
            writes_vcpkg_downloads: false

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Linux dependencies
        id: setup
        uses: ./.github/actions/setup-linux
        with:
          compiler: ${{ matrix.vcpkg_cache }}
          writes-downloads: ${{ matrix.writes_vcpkg_downloads }}

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/ccache
          key: ccache-v6-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ steps.setup.outputs.compiler-identity }}-${{ steps.setup.outputs.month }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v6-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ steps.setup.outputs.compiler-identity }}-${{ steps.setup.outputs.month }}-
            ccache-v6-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ steps.setup.outputs.compiler-identity }}-

      - name: Show compiler cache configuration
        shell: bash
        run: |
          ccache --version
          ccache --show-config

      - name: Reset compiler cache statistics
        shell: bash
        run: ccache --zero-stats

      - name: Run core CMake workflow preset
        shell: bash
        run: cmake --workflow --preset "${{ matrix.preset }}"

      - name: Save vcpkg downloads cache
        if: success() && matrix.writes_vcpkg_downloads && steps.setup.outputs.downloads-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/vcpkg/downloads
          key: ${{ steps.setup.outputs.downloads-cache-key }}

      # Jobs may use different installed toolchains and therefore different binary keys.
      - name: Save vcpkg binary cache
        if: success() && steps.setup.outputs.binary-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/vcpkg/archives
          key: ${{ steps.setup.outputs.binary-cache-key }}

      - name: Show compiler cache statistics
        if: always()
        shell: bash
        run: ccache --show-stats || true
