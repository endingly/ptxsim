name: Set up Linux build dependencies
description: Shared toolchain setup and cache identity for acceptance and main cache warmup jobs

inputs:
  compiler:
    description: Compiler family used to partition the vcpkg binary cache
    required: true
  writes-downloads:
    description: Whether this job owns shared APT and vcpkg download cache writes
    default: 'false'

outputs:
  month:
    description: UTC cache maintenance epoch
    value: ${{ steps.epoch.outputs.month }}
  compiler-identity:
    description: Fingerprint of installed compilers, build tools and OS, excluding runner image revisions
    value: ${{ steps.identity.outputs.compiler }}
  binary-cache-key:
    description: Exact dependency cache key shared by main and PR jobs
    value: ${{ steps.binaries.outputs.cache-primary-key }}
  binary-cache-hit:
    description: Whether the complete dependency cache key exists
    value: ${{ steps.binaries.outputs.cache-hit }}
  downloads-cache-key:
    description: Primary source-download cache key
    value: ${{ steps.downloads.outputs.cache-primary-key }}
  downloads-cache-hit:
    description: Whether the source-download cache was an exact hit
    value: ${{ steps.downloads.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Reject floating third-party action references
      shell: bash
      run: python3 .github/scripts/check-action-pins.py

    - name: Compute cache epoch
      id: epoch
      shell: bash
      run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

    - name: Restore APT package cache
      id: apt
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .cache/apt/archives
        key: apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.epoch.outputs.month }}-${{ hashFiles('.github/actions/setup-linux/action.yml') }}
        restore-keys: |
          apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.epoch.outputs.month }}-

    - name: Install system dependencies
      shell: bash
      env:
        APT_CACHE_DIR: ${{ github.workspace }}/.cache/apt/archives
      run: |
        mkdir -p "$APT_CACHE_DIR/partial"
        chmod 0777 "$APT_CACHE_DIR" "$APT_CACHE_DIR/partial"
        sudo apt-get update
        sudo apt-get \
          -o Dir::Cache::archives="$APT_CACHE_DIR" \
          -o Binary::apt::APT::Keep-Downloaded-Packages=true \
          install -y --no-install-recommends \
          build-essential ccache clang clang-format cmake curl flex gcc g++ \
          git ninja-build pkg-config python3 python3-pip python3-venv tar unzip zip
        sudo chmod -R a+rX "$APT_CACHE_DIR"

    - name: Save APT package cache
      if: inputs.writes-downloads == 'true' && steps.apt.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .cache/apt/archives
        key: ${{ steps.apt.outputs.cache-primary-key }}

    - name: Identify compiler and vcpkg revision
      id: identity
      shell: bash
      run: python3 .github/scripts/compiler-cache-identity.py

    - name: Restore vcpkg binary cache
      id: binaries
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .cache/vcpkg/archives
        key: vcpkg-binaries-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.compiler }}-${{ steps.identity.outputs.compiler }}-${{ steps.identity.outputs.vcpkg-revision }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.ports/**', 'CMakePresets.json') }}

    - name: Set up Python environment
      shell: bash
      run: |
        python3 -m venv .venv
        .venv/bin/python -m pip install -e .
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

    - name: Restore vcpkg downloads cache
      id: downloads
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .cache/vcpkg/downloads
        key: vcpkg-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.ports/**') }}
        restore-keys: |
          vcpkg-downloads-${{ runner.os }}-${{ runner.arch }}-

    - name: Prepare vcpkg cache directories
      shell: bash
      run: mkdir -p "$VCPKG_BINARY_CACHE" "$VCPKG_DOWNLOADS"

    - name: Set up vcpkg
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
      with:
        vcpkgDirectory: ${{ env.VCPKG_ROOT }}
        vcpkgGitCommitId: ${{ steps.identity.outputs.vcpkg-revision }}
        vcpkgJsonGlob: vcpkg.json
        runVcpkgInstall: false
        doNotCache: true
