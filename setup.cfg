[metadata]
name = ptxsim-codegen
version = 0.0.1
description = PTXSim execution IR and lowering code generators

[options]
python_requires = >=3.12
packages =
    ptxsim_codegen
    ptxsim_codegen.exec_ir
    ptxsim_codegen.exec_ir.instructions
    ptxsim_codegen.exec_ir_lowering
package_dir =
    ptxsim_codegen = python/ptxsim_codegen
    ptxsim_codegen.exec_ir = submod/exec_ir/python/codegen
    ptxsim_codegen.exec_ir.instructions = submod/exec_ir/python/instructions
    ptxsim_codegen.exec_ir_lowering = submod/exec_ir_lowering/python/codegen
include_package_data = True
install_requires =
    ptx_frontend @ git+https://github.com/endingly/ptx_frontend.git@c8ba6e97753235dfd1f94011c29e54c1e865a875#subdirectory=python

[options.package_data]
ptxsim_codegen.exec_ir.instructions =
    *.yaml

[options.entry_points]
console_scripts =
    ptxsim-exec-ir-codegen = ptxsim_codegen.exec_ir.cli:main
    ptxsim-exec-ir-lowering-codegen = ptxsim_codegen.exec_ir_lowering.cli:main
