[metadata]
name = ptxsim-codegen
version = 0.0.1
description = PTXSim execution IR and lowering code generators

[options]
python_requires = >=3.12
packages =
    ptxsim_codegen
    ptxsim_codegen.exec_ir
    ptxsim_codegen.exec_ir.instructions
    ptxsim_codegen.exec_ir_lowering
    ptxsim_codegen.inst_execute_engine
package_dir =
    ptxsim_codegen = python/ptxsim_codegen
    ptxsim_codegen.exec_ir = submod/exec_ir/python/codegen
    ptxsim_codegen.exec_ir.instructions = submod/exec_ir/python/instructions
    ptxsim_codegen.exec_ir_lowering = submod/exec_ir_lowering/python/codegen
    ptxsim_codegen.inst_execute_engine = submod/inst_execute_engine/python/codegen
include_package_data = True
install_requires =
    Jinja2>=3.1,<4
    ptx_frontend @ git+https://github.com/endingly/ptx_frontend.git@cf1f32161890b04e1060095a96ad5d8ab996db27#subdirectory=python

[options.package_data]
ptxsim_codegen.inst_execute_engine =
    templates/*.j2
    templates/families/*.j2
ptxsim_codegen.exec_ir.instructions =
    *.yaml

[options.entry_points]
console_scripts =
    ptxsim-exec-ir-codegen = ptxsim_codegen.exec_ir.cli:main
    ptxsim-exec-ir-lowering-codegen = ptxsim_codegen.exec_ir_lowering.cli:main
    ptxsim-inst-engine-codegen = ptxsim_codegen.inst_execute_engine.cli:main
