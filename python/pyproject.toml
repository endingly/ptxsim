[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptxsim-codegen"
version = "0.0.1"
description = "PTXSim execution IR and lowering code generators"
requires-python = ">=3.12"
dependencies = [
    "Jinja2>=3.1,<4",
    "ptx_frontend @ git+https://github.com/endingly/ptx_frontend.git@1a32fac33be61c0f540caaecf2ce14373c281b45#subdirectory=python",
]

[project.scripts]
ptxsim-exec-ir-codegen = "ptxsim_codegen.code_gen.exec_ir.cli:main"
ptxsim-exec-ir-lowering-codegen = "ptxsim_codegen.code_gen.lowering.cli:main"
ptxsim-inst-engine-codegen = "ptxsim_codegen.code_gen.engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ptxsim_codegen.code_gen" = ["templates/*.j2", "templates/families/*.j2"]
"ptxsim_codegen.resources" = ["*.yaml"]
