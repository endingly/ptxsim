- form: bar/bar_warp_sync
  handler: barrier
  layouts: [default]
  controls:
    warp: [true]
    sync: [true]
- form: bra/bra_direct
  handler: control
  layouts: [default]
  controls:
    uni: [true, false]
- form: exit/exit_bare
  handler: control
  layouts: [default]
  controls: {}
