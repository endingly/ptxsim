  scope: {cpp_type: MemoryScope, values: {cluster: MemoryScope::cluster, cta: MemoryScope::cta, gpu: MemoryScope::gpu, none: MemoryScope::none, sys: MemoryScope::sys}}
  vector: {cpp_type: VectorArity, values: {v2: VectorArity::v2, v4: VectorArity::v4, v8: VectorArity::v8}}
  state_space: {cpp_type: AddressSpace, values: {const: AddressSpace::const_, generic: AddressSpace::generic, global: AddressSpace::global, local: AddressSpace::local, param: AddressSpace::param, "param::entry": AddressSpace::param_entry, "param::func": AddressSpace::param_func, shared: AddressSpace::shared, "shared::cta": AddressSpace::shared_cta, "shared::cluster": AddressSpace::shared_cluster}}
  phase_type: {cpp_type: MbarrierPhaseType, values: {"phase_type::conditional": MbarrierPhaseType::conditional, "phase_type::primary": MbarrierPhaseType::primary}}
  mbarrier_layout: {cpp_type: MbarrierLayout, values: {"layout::v0": MbarrierLayout::v0, "layout::v1": MbarrierLayout::v1}}
  proxy: {cpp_type: AsyncProxyKind, values: {async: AsyncProxyKind::async, "async.global": AsyncProxyKind::async_global, "async.shared::cluster": AsyncProxyKind::async_shared_cluster, "async.shared::cta": AsyncProxyKind::async_shared_cta}}
  proxy_pair: {cpp_type: ProxyKindPair, values: {"async::generic": ProxyKindPair::async_generic, "tensormap::generic": ProxyKindPair::tensormap_generic}}
  flag: {cpp_type: bool, values: {true: "true", false: "false"}}

