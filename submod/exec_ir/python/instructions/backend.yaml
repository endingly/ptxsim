  rounding: {cpp_type: RoundingMode, values: {rn: RoundingMode::rn, rz: RoundingMode::rz, rm: RoundingMode::rm, rp: RoundingMode::rp, rzi: RoundingMode::rzi, rna: RoundingMode::rna, rni: RoundingMode::rni, rmi: RoundingMode::rmi, rpi: RoundingMode::rpi, rs: RoundingMode::rs}}
  comparison: {cpp_type: ComparisonOperator, values: {eq: ComparisonOperator::eq, lt: ComparisonOperator::lt, ge: ComparisonOperator::ge, ne: ComparisonOperator::ne, le: ComparisonOperator::le, gt: ComparisonOperator::gt, lo: ComparisonOperator::lo, ls: ComparisonOperator::ls, hi: ComparisonOperator::hi, hs: ComparisonOperator::hs, equ: ComparisonOperator::equ, neu: ComparisonOperator::neu, ltu: ComparisonOperator::ltu, leu: ComparisonOperator::leu, gtu: ComparisonOperator::gtu, geu: ComparisonOperator::geu, num: ComparisonOperator::num, nan: ComparisonOperator::nan}}
  boolean_op: {cpp_type: BooleanOperator, values: {and: BooleanOperator::and_, or: BooleanOperator::or_, xor: BooleanOperator::xor_}}
  cache: {cpp_type: CacheOperator, values: {ca: CacheOperator::ca, cg: CacheOperator::cg, cs: CacheOperator::cs, cv: CacheOperator::cv, lu: CacheOperator::lu, unspecified: CacheOperator::unspecified, wb: CacheOperator::wb, wt: CacheOperator::wt}}
  eviction_priority: {cpp_type: EvictionPriority, values: {evict_first: EvictionPriority::evict_first, evict_last: EvictionPriority::evict_last, evict_normal: EvictionPriority::evict_normal, evict_unchanged: EvictionPriority::evict_unchanged, no_allocate: EvictionPriority::no_allocate, invalid: EvictionPriority::invalid}}
  prefetch_size: {cpp_type: PrefetchSize, values: {none: PrefetchSize::none, "L2::64B": PrefetchSize::l2_64b, "L2::128B": PrefetchSize::l2_128b, "L2::256B": PrefetchSize::l2_256b}}
  test_property: {cpp_type: TestProperty, values: {finite: TestProperty::finite, infinite: TestProperty::infinite, number: TestProperty::number, notanumber: TestProperty::notanumber, normal: TestProperty::normal, subnormal: TestProperty::subnormal}}
